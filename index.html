<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c1654a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192-v2.png">
<title>每日 SOP 核查表</title>
<style>
:root{
  --bg:#f3ece3; --card:#fbf7f1; --ink:#3b2f2a; --sub:#8a7a6d;
  --accent:#c1654a; --accent2:#7d8c6a; --ok:#6f8f4e; --line:#e6dccf;
  --dock-h:62px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Georgia,"Songti SC","PingFang SC","Microsoft YaHei",serif;line-height:1.6;
  padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 12px)}
.wrap{max-width:860px;margin:0 auto;padding:18px 16px 8px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
header h1{font-size:21px;margin:0 0 2px;color:var(--accent)}
header p{margin:0;color:var(--sub);font-size:12.5px}
.sync-pill{border:1px solid var(--line);background:#fffdf9;color:var(--sub);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;flex:none;margin-top:2px}
.sync-pill.ok{border-color:var(--ok);color:var(--ok)}
.sync-pill.warn{border-color:#d9b24a;color:#9a7a1e}
.sync-pill.err{border-color:var(--accent);color:var(--accent);background:#f6e7e0}
.datebar{display:flex;align-items:center;gap:10px;margin:14px 0 6px;flex-wrap:wrap}
.datebar input[type=date]{border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;background:var(--card);color:var(--ink);font-family:inherit}
.btn{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:12px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.warn{color:var(--accent);border-color:#e7c4b8}
.btn.warn:hover{background:#f6e7e0}

.panel{display:none;animation:fade .18s ease}
.panel.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:17px;margin:0 0 10px;color:var(--accent);display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:5px;height:17px;background:var(--accent);border-radius:3px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px;color:var(--sub)}
.prog .track{flex:1;height:7px;background:var(--line);border-radius:6px;overflow:hidden}
.prog .bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .25s}
ul.clist{list-style:none;margin:0;padding:0}
ul.clist li{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line)}
ul.clist li:last-child{border-bottom:none}
ul.clist li.editing{align-items:center;flex-wrap:wrap}
ul.clist input[type=checkbox]{margin-top:4px;width:19px;height:19px;accent-color:var(--accent);flex:none}
ul.clist label{flex:1;font-size:14.5px;cursor:pointer;min-width:0;word-break:break-word}
ul.clist input:checked + label{color:var(--sub);text-decoration:line-through}
.acts{display:flex;gap:6px;flex:none}
.mini{border:1px solid var(--line);background:#fffdf9;color:var(--sub);border-radius:9px;padding:4px 10px;font-size:12.5px;cursor:pointer;font-family:inherit}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.mini.del:hover{border-color:var(--accent);color:var(--accent);background:#f6e7e0}
.mini.ghost{color:var(--sub)}
.edit-in{flex:1;min-width:160px;border:1px solid var(--accent);border-radius:9px;padding:7px 9px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fffdf9;color:var(--ink)}

.field label{display:block;font-size:13px;color:var(--accent2);margin-bottom:5px;font-weight:600}
.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:14px;font-family:inherit;resize:vertical;background:#fffdf9;color:var(--ink)}
.field textarea:focus{outline:none;border-color:var(--accent)}

/* 多维复盘 */
.rv-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.rv-tag{border:1px solid var(--line);background:#fffdf9;color:var(--sub);border-radius:20px;padding:5px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.rv-tag.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.rv-item{position:relative;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:9px;font-size:13.5px;padding-right:62px;background:#fffdf9}
.rv-item .tag{margin-right:8px}
.rv-sub{margin-top:3px;color:var(--sub);font-size:12.5px}
.rv-sub.bad{color:var(--accent)}
.rv-item .mini{position:absolute;right:8px;top:9px}
.rv-empty{color:var(--sub);font-size:13px;padding:6px 0}

.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;background:#f0e3d8;color:var(--accent)}

.setting-row{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.setting-row label{font-size:13px;color:var(--accent2);font-weight:600}
.setting-row input,.setting-row textarea{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;font-family:inherit;background:#fffdf9;color:var(--ink)}
.setting-row .hint{font-size:12px;color:var(--sub)}
.foot{margin-top:10px;font-size:12px;color:var(--sub)}
.sync-status{font-size:12.5px;color:var(--sub);min-height:16px;margin-top:4px}
.sync-status.ok{color:var(--ok)} .sync-status.warn{color:#9a7a1e} .sync-status.err{color:var(--accent)}
.sync-gist{font-size:12px;color:var(--sub);margin-top:6px}
.sync-gist a{color:var(--accent)}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;height:calc(var(--dock-h) + env(safe-area-inset-bottom,0px));
  background:rgba(251,247,241,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:50}
.dock-btn{flex:1;border:none;background:transparent;color:var(--sub);font-family:inherit;font-size:12.5px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;padding:6px 2px}
.dock-btn .ic{font-size:18px;line-height:1}
.dock-btn.active{color:var(--accent)}
.dock-btn.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:26px;height:3px;border-radius:3px;background:var(--accent)}

@media(max-width:560px){
  header h1{font-size:19px}
  .wrap{padding:14px 12px 4px}
  ul.clist label{font-size:15px}
  .dock-btn{font-size:11.5px}
  .dock-btn .ic{font-size:17px}
  .wtab{font-size:12px}
  .wtab th,.wtab td{padding:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>每日 SOP 核查表</h1>
      <p>图表复盘 · 每日必做 · 读书SOP · 多维复盘</p>
    </div>
    <div class="sync-pill" id="syncPill" onclick="showTab('settings')">同步 · 未启用</div>
  </header>

  <div class="datebar">
    <span style="font-size:13px;color:var(--sub)">当前日期</span>
    <input type="date" id="dateIn" onchange="setDate(this.value)">
    <button class="btn" onclick="goToday()">回到今天</button>
  </div>

  <!-- 积累 -->
  <section class="panel show" id="tab-must"></section>
  <!-- 交易 -->
  <section class="panel" id="tab-chart"></section>
  <!-- 读书 -->
  <section class="panel" id="tab-reading"></section>
  <!-- 复盘（多维复盘） -->
  <section class="panel" id="tab-log">
    <div class="card">
      <h2>多维复盘（六类）</h2>
      <div class="rv-tags">
        <span class="rv-tag active" data-type="life">生活</span>
        <span class="rv-tag" data-type="trade">交易</span>
        <span class="rv-tag" data-type="study">学习</span>
        <span class="rv-tag" data-type="idea">idea</span>
        <span class="rv-tag" data-type="think">思考</span>
        <span class="rv-tag" data-type="summary">一日总结</span>
      </div>
      <div id="rvNormal">
        <div class="field"><label>这一段做了什么</label><textarea id="rvWhat" rows="2" placeholder="例如：完成了早餐、看了 PA 课程第 3 集"></textarea></div>
        <div class="field"><label>做对了什么</label><textarea id="rvGood" rows="2" placeholder="提炼一个可复用的正确动作"></textarea></div>
        <div class="field"><label>哪里可以更好</label><textarea id="rvBad" rows="2" placeholder="记录失误、情绪或下次要避开的坑"></textarea></div>
      </div>
      <div id="rvSingle" style="display:none">
        <div class="field"><label id="rvSingleLabel">内容</label><textarea id="rvSingleText" rows="4" placeholder="写下你的复盘…"></textarea></div>
      </div>
      <div class="btn-row">
        <button class="btn warn" onclick="rvReset()">清空</button>
        <button class="btn" style="border-color:var(--accent);color:var(--accent)" onclick="addReview()">+ 记一条复盘</button>
      </div>
      <div id="rvList" style="margin-top:14px"></div>
    </div>
  </section>
  <!-- 设置 -->
  <section class="panel" id="tab-settings">
    <div class="card" id="syncCard">
      <h2>云端同步</h2>
      <div class="setting-row">
        <label>GitHub Token</label>
        <input type="password" id="syncToken" placeholder="粘贴 GitHub Token（账号 vviptl629-bot）" autocomplete="off">
        <span class="hint">Token 仅存本机浏览器，用于读写你的私有 Gist。建议用 fine-grained token 并勾选 gist 权限。</span>
      </div>
      <div class="setting-row">
        <label>Gist ID（留空自动新建）</label>
        <input id="syncGistId" placeholder="留空则首次同步自动创建">
      </div>
      <div class="setting-row" style="flex-direction:row;flex-wrap:wrap;gap:8px">
        <button class="btn" id="syncEnable" style="border-color:var(--accent);color:var(--accent)">启用并同步</button>
        <button class="btn" id="syncNow">立即同步</button>
        <button class="btn warn" id="syncClearToken">清除 Token</button>
      </div>
      <div class="sync-status" id="syncStatus"></div>
      <div class="sync-gist" id="syncGistInfo"></div>
      <div class="foot">每 45 秒自动拉取、改动后 0.8 秒防抖推送。两台设备用相同 Token + Gist ID 即共享同一份数据。</div>
    </div>
    <div class="card">
      <h2>数据管理</h2>
      <div class="setting-row">
        <button class="btn" onclick="exportJSON()">导出备份（JSON）</button>
        <span class="hint">部署云端前可先本地备份 / 迁移。</span>
      </div>
      <div class="setting-row">
        <label>导入备份（JSON）</label>
        <input type="file" id="importFile" accept="application/json" onchange="importJSON(this)">
      </div>
      <div class="setting-row">
        <span class="hint">也支持导入「每日复盘」的导出文件：会自动按日期合并进各日的多维复盘。</span>
      </div>
      <div class="setting-row">
        <button class="btn warn" onclick="resetAll()">清空全部数据</button>
      </div>
    </div>
  </section>
</div>

<nav class="dock" id="dock">
  <button class="dock-btn active" data-tab="must"><span class="ic">◆</span>积累</button>
  <button class="dock-btn" data-tab="chart"><span class="ic">▮</span>交易</button>
  <button class="dock-btn" data-tab="reading"><span class="ic">▤</span>读书</button>
  <button class="dock-btn" data-tab="log"><span class="ic">✎</span>复盘</button>
  <button class="dock-btn" data-tab="settings"><span class="ic">⚙</span>设置</button>
</nav>

<script>
const KEY="sop_proto_C_v2";
const DEFAULTS={
  must:{title:"每日必做任务（积累）",items:[
    "固定时间起床（不熬夜）",
    "身体锻炼/拉伸 ≥20分钟",
    "英语学习：赖世雄课程 + 原版书（弱读/连读）",
    "图表复盘（见交易 Tab）",
    "阅读推进（记录绝对页码）",
    "人生母题访谈/写作（或既定创作）",
    "填写当日多维复盘（复盘 Tab）"
  ]},
  chart:{title:"每日图表复盘核查（交易）",items:[
    "复盘当日主交易时段关键K线（开盘/欧盘/美盘）",
    "标记≥3个关键信号bar/形态（pin bar、inside bar、趋势bar等）",
    "图上标注：入场区、止损位、目标位",
    "对照当日交易计划，核对是否按计划执行",
    "记录每笔交易的R倍数与纪律遵守情况",
    "截图归档当日图表（含标注）",
    "写下1条今日价格行为观察/教训"
  ]},
  reading:{title:"读书SOP核查",items:[
    "明确今日阅读书目与章节",
    "设定目标：到达绝对页码 ___",
    "无干扰专注阅读 ≥30分钟",
    "高亮/批注关键句",
    "记录「今日已到达绝对页码」：___",
    "输出一句话总结/收获"
  ]}
};
const REVIEW_TYPES={life:'生活',trade:'交易',study:'学习',idea:'idea',think:'思考',summary:'一日总结'};
function uid(){return 'i'+Math.random().toString(36).slice(2,9)}
function seed(){const L={};for(const g in DEFAULTS)L[g]={title:DEFAULTS[g].title,items:DEFAULTS[g].items.map(t=>({id:uid(),text:t}))};return L}

let state={};
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!state.lists||!state.days){state={lists:seed(),days:{}}}

let cur=new Date().toISOString().slice(0,10);
let activeTab="must";
let editingId=null;

function day(){return state.days[cur]||(state.days[cur]={done:{chart:{},must:{},reading:{}},reviews:[]})}
function save(){localStorage.setItem(KEY,JSON.stringify(state));schedulePush();}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function escAttr(s){return esc(s).replace(/"/g,"&quot;")}

function renderList(g){
  const panel=document.getElementById('tab-'+g);
  const list=state.lists[g];
  const done=day().done[g];
  const n=list.items.length;
  const dc=list.items.filter(it=>done[it.id]).length;
  const pct=n?Math.round(dc/n*100):0;
  let html=`<div class="card"><h2>${esc(list.title)}</h2>
    <div class="prog"><div class="track"><div class="bar" style="width:${pct}%"></div></div><span>${dc}/${n}</span></div>
    <ul class="clist">`;
  list.items.forEach(it=>{
    if(editingId===it.id){
      html+=`<li class="editing"><input class="edit-in" id="edit-${it.id}" value="${escAttr(it.text)}">
        <button class="mini" onclick="saveEdit('${g}','${it.id}')">保存</button>
        <button class="mini ghost" onclick="cancelEdit()">取消</button></li>`;
    }else{
      const checked=!!done[it.id];
      html+=`<li>
        <input type="checkbox" ${checked?'checked':''} onchange="toggle('${g}','${it.id}',this.checked)">
        <label>${esc(it.text)}</label>
        <span class="acts">
          <button class="mini" onclick="startEdit('${g}','${it.id}')">编辑</button>
          <button class="mini del" onclick="delItem('${g}','${it.id}')">删除</button>
        </span></li>`;
    }
  });
  html+=`</ul><div class="addrow"><input id="add-${g}" placeholder="添加新项目…"><button class="mini" onclick="addItem('${g}')">添加</button></div></div>`;
  panel.innerHTML=html;
  if(editingId){
    const e=document.getElementById('edit-'+editingId);
    if(e){e.focus();e.select();
      e.onkeydown=ev=>{if(ev.key==='Enter')saveEdit2(g,editingId);if(ev.key==='Escape')cancelEdit();};
    }
  }
}
function updateProg(g){
  const panel=document.getElementById('tab-'+g);
  const list=state.lists[g];const done=day().done[g];
  const n=list.items.length;const dc=list.items.filter(it=>done[it.id]).length;
  const pct=n?Math.round(dc/n*100):0;
  const bar=panel.querySelector('.bar');if(bar)bar.style.width=pct+'%';
  const sp=panel.querySelector('.prog span');if(sp)sp.textContent=dc+'/'+n;
}
function toggle(g,id,v){day().done[g][id]=v;save();updateProg(g)}
function startEdit(g,id){editingId=id;renderList(g)}
function cancelEdit(){editingId=null;if(['must','chart','reading'].includes(activeTab))renderList(activeTab)}
function saveEdit(g,id){saveEdit2(g,id)}
function saveEdit2(g,id){const el=document.getElementById('edit-'+id);if(el){const t=el.value.trim()||'未命名';const it=state.lists[g].items.find(x=>x.id===id);if(it)it.text=t;save();}editingId=null;renderList(g)}
function delItem(g,id){if(confirm('确定删除该项目？')){state.lists[g].items=state.lists[g].items.filter(x=>x.id!==id);for(const d in state.days)delete state.days[d].done[g][id];save();renderList(g);}}
function addItem(g){const el=document.getElementById('add-'+g);const t=(el.value||'').trim();if(!t)return;state.lists[g].items.push({id:uid(),text:t});el.value='';save();renderList(g)}

function renderAllLists(){['must','chart','reading'].forEach(renderList)}

function setDate(d){cur=d;renderAllLists();fillLog()}
function goToday(){cur=new Date().toISOString().slice(0,10);document.getElementById('dateIn').value=cur;renderAllLists();fillLog()}
function fillLog(){
  document.getElementById('dateIn').value=cur;
  renderReviews();
}

/* ---------- 多维复盘（六类） ---------- */
let rvType='life';
function applyRvTypeUI(){
  const single=['idea','think','summary'].includes(rvType);
  document.getElementById('rvNormal').style.display=single?'none':'block';
  document.getElementById('rvSingle').style.display=single?'block':'none';
  if(single){
    document.getElementById('rvSingleLabel').textContent = rvType==='summary'?'这一天，整体上' : (rvType==='idea'?'点子 / 想法':'思考 / 感悟');
    document.getElementById('rvSingleText').placeholder = rvType==='summary'?'用一段话总结今天：整体做了什么、状态如何、最关键的收获或教训。' : (rvType==='idea'?'记下突然冒出的点子、灵感或想法':'记录一段思考、推演或感悟：触发是什么、怎么想的、得出什么结论。');
  }
  document.querySelectorAll('.rv-tag').forEach(t=>t.classList.toggle('active',t.dataset.type===rvType));
}
function rvReset(){document.getElementById('rvWhat').value='';document.getElementById('rvGood').value='';document.getElementById('rvBad').value='';document.getElementById('rvSingleText').value='';}
function addReview(){
  const single=['idea','think','summary'].includes(rvType);
  let what, good='', bad='';
  if(single){ what=document.getElementById('rvSingleText').value.trim(); }
  else { what=document.getElementById('rvWhat').value.trim(); good=document.getElementById('rvGood').value.trim(); bad=document.getElementById('rvBad').value.trim(); }
  if(!what) return;
  const revs=day().reviews||(day().reviews=[]);
  revs.unshift({id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),type:rvType,what,good,bad,ts:Date.now()});
  rvReset();
  save(); renderReviews();
}
function renderReviews(){
  const revs=(day().reviews||[]).slice().sort((a,b)=>b.ts-a.ts);
  const box=document.getElementById('rvList');
  if(!revs.length){ box.innerHTML='<div class="rv-empty">还没有复盘记录，选一个类型记一条。</div>'; return; }
  let h='';
  revs.forEach(r=>{
    const label=REVIEW_TYPES[r.type]||'生活';
    const hasGB=(r.good||r.bad);
    let body=esc(r.what||'');
    if(hasGB){
      if(r.good) body+='<div class="rv-sub">✔ '+esc(r.good)+'</div>';
      if(r.bad) body+='<div class="rv-sub bad">✘ '+esc(r.bad)+'</div>';
    }
    h+=`<div class="rv-item"><span class="tag">${label}</span>${body}<button class="mini del" onclick="delReview('${r.id}')">删除</button></div>`;
  });
  box.innerHTML=h;
}
function delReview(id){ if(confirm('删除这条复盘？')){ const revs=day().reviews||[]; day().reviews=revs.filter(x=>x.id!==id); save(); renderReviews(); } }
document.querySelectorAll('.rv-tag').forEach(t=>t.addEventListener('click',()=>{rvType=t.dataset.type;applyRvTypeUI();}));

function showTab(name){
  activeTab=name;editingId=null;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('show'));
  document.getElementById('tab-'+name).classList.add('show');
  document.querySelectorAll('.dock-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  if(['must','chart','reading'].includes(name))renderList(name);
  if(name==='log')fillLog()
  window.scrollTo({top:0,behavior:'smooth'});
}
document.getElementById('dock').addEventListener('click',e=>{const b=e.target.closest('.dock-btn');if(b)showTab(b.dataset.tab)});

function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sop-backup-'+cur+'.json';a.click()}
function importJSON(input){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      // 情形 A：SOP 自身备份 → 整份替换
      if(d && d.lists && d.days){
        state=d; save(); renderAllLists(); fillLog(); renderReviews();
        alert('已导入 SOP 备份');
      }
      // 情形 B：每日复盘导出 → 合并进各日「多维复盘」（type 对齐：life/trade/study/idea/think/summary）
      else if(d && (d._app==='daily-review' || Array.isArray(d.entries))){
        const src=d.entries||[]; let n=0;
        src.forEach(e=>{
          if(!e || !e.date || !e.type) return;
          const dayObj=state.days[e.date] || (state.days[e.date]={done:{chart:{},must:{},reading:{}},reviews:[]});
          const revs=dayObj.reviews || (dayObj.reviews=[]);
          revs.push({id:'dr'+e.id, type:e.type, what:e.what||'', good:e.good||'', bad:e.bad||'', done:!!e.done, ts:e.updated||Date.now()});
          n++;
        });
        save(); renderReviews();
        alert('已合并每日复盘 '+n+' 条到对应日期的多维复盘');
      }
      else alert('文件格式不正确');
    }catch(e){ alert('解析失败：'+(e&&e.message||e)); }
    input.value='';
  };
  r.readAsText(f);
}
function resetAll(){if(confirm('确定清空全部数据？此操作不可恢复。')){localStorage.removeItem(KEY);state={lists:seed(),days:{}};cur=new Date().toISOString().slice(0,10);document.getElementById('dateIn').value=cur;renderAllLists();fillLog()}}

/* ---------- GitHub Gist 云端同步（移植自每日复盘工作台） ---------- */
const SYNC_KEY='sop_sync_v1', SYNC_FILE='sop_checklist_data.json', SYNC_VER=1;
let sync={enabled:false,token:'',gistId:'',_t:null,_retry:null,_lastOk:0,rev:0,lastRev:0,tokenAt:0,dirty:false};
try{const _s=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}');sync.enabled=!!_s.enabled;sync.token=_s.token||'';sync.gistId=_s.gistId||'';sync.rev=parseInt(_s.rev||'0',10)||0;sync.lastRev=parseInt(_s.lastRev||'0',10)||0;sync.tokenAt=parseInt(_s.tokenAt||'0',10)||0;}catch(e){}
function saveSyncCfg(){localStorage.setItem(SYNC_KEY,JSON.stringify({enabled:sync.enabled,token:sync.token,gistId:sync.gistId,rev:sync.rev,lastRev:sync.lastRev,tokenAt:sync.tokenAt}));}
const TOKEN_TTL_DAYS=90;
function tokenAgeDays(){return sync.tokenAt?Math.floor((Date.now()-sync.tokenAt)/86400000):0;}
function tokenExpired(){return tokenAgeDays()>=TOKEN_TTL_DAYS;}
function syncStatus(msg,cls){const el=document.getElementById('syncStatus');if(el){el.textContent=msg||'';el.className='sync-status'+(cls?' '+cls:'');}const pill=document.getElementById('syncPill');if(pill){pill.textContent=msg?msg.replace(/^已同步 /,'同步 '):'同步 · 未启用';pill.className='sync-pill'+(cls?' '+cls:'');}}
function payload(){sync.rev=Math.max(sync.rev||0,sync.lastRev||0)+1;return JSON.stringify({v:SYNC_VER,rev:sync.rev,baseRev:sync.lastRev||0,updatedAt:Date.now(),state:state});}
async function gistReq(method,id,body){const url=id?('https://api.github.com/gists/'+id):'https://api.github.com/gists';const opt={method,headers:{'Authorization':'Bearer '+sync.token,'Content-Type':'application/json','Accept':'application/vnd.github+json'}};if(body)opt.body=JSON.stringify(body);const r=await fetch(url,opt);if(r.status===401)throw new Error('GitHub 401 · Token 已失效，请重新生成带 gist 权限的新 Token');if(r.status===403)throw new Error('GitHub 403 · Token 缺少 gist 权限');if(!r.ok)throw new Error('GitHub '+r.status);return r.json();}
async function pushSync(){if(!sync.enabled||!sync.token)return;clearTimeout(sync._t);try{const body=payload();if(!sync.gistId){const g=await gistReq('POST',null,{description:'每日SOP核查表 数据同步',public:false,files:{[SYNC_FILE]:{content:body}}});sync.gistId=g.id;saveSyncCfg();}else{await gistReq('PATCH',sync.gistId,{files:{[SYNC_FILE]:{content:body}}});}sync.lastRev=sync.rev;sync.dirty=false;saveSyncCfg();syncStatus('已同步 '+new Date().toLocaleTimeString(),'ok');if(sync._retry){clearInterval(sync._retry);sync._retry=null;}}catch(e){sync._pending=true;if(/40[13]/.test(e&&e.message||'')){if(sync._retry){clearInterval(sync._retry);sync._retry=null;}syncStatus('⚠ '+(e.message||'同步失败'),'err');return;}syncStatus(navigator.onLine===false?'离线，联网后上传':'同步失败，将重试：'+(e&&e.message?e.message:e),'warn');startPendingRetry();}}
function startPendingRetry(){if(sync._retry)return;sync._retry=setInterval(()=>{if(!sync.enabled||!sync.token){clearInterval(sync._retry);sync._retry=null;return;}pushSync();},6000);}
function schedulePush(){if(!sync.enabled||!sync.token)return;sync.dirty=true;clearTimeout(sync._t);sync._t=setTimeout(pushSync,800);}
async function pullSync(silent){if(!sync.enabled||!sync.token||!sync.gistId)return;try{const g=await gistReq('GET',sync.gistId);const f=g.files&&g.files[SYNC_FILE];if(!f||!f.content)return;const d=JSON.parse(f.content);if(d&&d.rev&&d.rev>sync.rev){if(d.state){state=d.state;save();rerenderAll();}sync.rev=d.rev;sync.lastRev=d.rev;saveSyncCfg();}else if(d&&d.rev){sync.lastRev=d.rev;saveSyncCfg();}sync._lastOk=Date.now();if(!silent)syncStatus('已同步云端 '+new Date().toLocaleTimeString(),'ok');}catch(e){if(/40[13]/.test(e&&e.message||'')){if(sync._retry){clearInterval(sync._retry);sync._retry=null;}syncStatus('⚠ '+(e.message||'拉取失败'),'err');return;}if(!silent)syncStatus('拉取失败：'+(e&&e.message?e.message:e),'err');}}
async function syncNow(){if(!sync.enabled||!sync.token){syncStatus('请先启用同步','err');return;}syncStatus('同步中…');await pullSync();await pushSync();}
let _autoPull=null;function startAutoPull(){if(_autoPull)return;_autoPull=setInterval(()=>{(async()=>{if(typeof navigator!=='undefined'&&navigator.onLine===false)return;if(sync.dirty){await pushSync();}await pullSync(true);})();},45000);}
function showGistInfo(){const el=document.getElementById('syncGistInfo');if(!el)return;el.innerHTML=sync.gistId?('已绑定私有 Gist：<a href="https://gist.github.com/'+sync.gistId+'" target="_blank" rel="noopener">'+sync.gistId+'</a><br>在两台设备用<b>相同 Token + 此 ID</b> 即可共享同一份数据。'):'';}
function rerenderAll(){renderAllLists();fillLog();if(activeTab==='log')renderReviews();}
document.getElementById('syncEnable').onclick=async()=>{const prev=sync.token;sync.token=document.getElementById('syncToken').value.trim();sync.gistId=document.getElementById('syncGistId').value.trim();if(!sync.token){syncStatus('请先粘贴 Token','err');return;}if(sync.token!==prev)sync.tokenAt=Date.now();sync.enabled=true;saveSyncCfg();syncStatus('同步中…');await syncNow();startAutoPull();showGistInfo();};
document.getElementById('syncNow').onclick=()=>syncNow();
document.getElementById('syncClearToken').onclick=()=>{if(window.confirm('清除本机保存的 Token 并停用同步？')){sync.token='';sync.tokenAt=0;sync.enabled=false;sync.gistId='';saveSyncCfg();document.getElementById('syncToken').value='';document.getElementById('syncGistId').value='';showGistInfo();syncStatus('已清除本机 Token');}};

/* ---------- 初始化 ---------- */
document.getElementById('dateIn').value=cur;
applyRvTypeUI();
renderAllLists();fillLog();
if(sync.enabled&&sync.token){syncStatus('同步中…');syncNow();startAutoPull();}
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(function(e){console.log('SW register failed',e)})});}
